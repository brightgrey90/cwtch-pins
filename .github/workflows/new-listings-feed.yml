name: New Etsy listings to Pinterest feed

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listings-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Etsy for new listings
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: python3 automation/etsy_to_feed.py
      - name: Save changes
        run: |
          git config user.name "cwtch-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/seen.json automation/feed-items.json feed/new-listings.xml
          git diff --cached --quiet || { git commit -m "Update new listings feed"; git push; }
